<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Zen Launcher</title>
<style>
    :root {
        --theme-color: #8E24AA;
    }
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Segoe UI', sans-serif;
        background: #1e1e1e;
        color: #eee;
        overflow: hidden;
    }
    #app {
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    #toolbar {
        background: var(--theme-color);
        display: flex;
        align-items: center;
        padding: 10px 14px;
        gap: 10px;
    }
    #toolbar h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
        margin-right: auto;
    }
    #accountName {
        font-size: 13px;
        opacity: 0.9;
    }
    #toolbar button {
        background: rgba(255,255,255,0.15);
        border: none;
        color: white;
        padding: 7px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
    }
    #toolbar button:hover {
        background: rgba(255,255,255,0.3);
    }
    #menuDropdown {
        display: none;
        position: absolute;
        top: 50px;
        right: 10px;
        background: #2a2a2a;
        border-radius: 8px;
        padding: 8px;
        z-index: 999;
        min-width: 220px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #menuDropdown.show { display: block; }
    #menuDropdown button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: #eee;
        padding: 10px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 13px;
    }
    #menuDropdown button:hover {
        background: #3a3a3a;
    }
    #colorPicker {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px;
    }
    .swatch {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid #555;
    }
    #content {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-content: start;
    }
    .card {
        background: #262626;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 14px;
    }
    .card h2 {
        margin: 0 0 10px 0;
        font-size: 14px;
        color: #cfa8dd;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .card label {
        display: block;
        font-size: 12px;
        margin-bottom: 10px;
        opacity: 0.85;
    }
    input, select {
        width: 100%;
        padding: 7px 10px;
        margin-top: 4px;
        background: #1a1a1a;
        border: 1px solid #3a3a3a;
        color: #eee;
        border-radius: 6px;
        font-size: 13px;
    }
    .btn {
        background: var(--theme-color);
        border: none;
        color: white;
        padding: 9px 14px;
        border-radius: 6px;
        cursor: pointer;
        margin: 4px 6px 4px 0;
        font-size: 13px;
    }
    .btn:hover { filter: brightness(1.15); }
    .btn-play {
        background: #33b56b;
        font-weight: bold;
        font-size: 14px;
        padding: 10px 20px;
    }
    .btn-play:hover { background: #47cd80; }
    #modResults {
        list-style: none;
        margin: 10px 0 0 0;
        padding: 0;
        max-height: 220px;
        overflow-y: auto;
    }
    #modResults li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 0;
        border-bottom: 1px solid #333;
        font-size: 12px;
        gap: 8px;
    }
    #modResults li span { flex: 1; }
    #logCard { grid-column: 1 / -1; }
    #logOutput {
        background: #101010;
        padding: 10px;
        height: 170px;
        overflow-y: auto;
        font-size: 12px;
        white-space: pre-wrap;
        border-radius: 6px;
        font-family: Consolas, monospace;
    }
</style>
</head>
<body>
<div id="app">
    <div id="toolbar">
        <h1>Zen Launcher</h1>
        <span id="accountName">Niezalogowany</span>
        <label style="display:flex; align-items:center; gap:4px; font-size:12px; margin:0;">
            <input type="checkbox" id="rememberMe" style="width:auto;" checked />
            Zapamietaj mnie
        </label>
        <button id="loginBtn">Zaloguj Microsoft</button>
        <button id="logoutBtn" style="display:none">Wyloguj</button>
        <button id="menuBtn">⋮</button>
    </div>

    <div id="menuDropdown">
        <div style="font-size:12px; opacity:0.7; padding:6px 10px;">Kolor motywu</div>
        <div id="colorPicker">
            <div class="swatch" style="background:#8E24AA" data-color="#8E24AA"></div>
            <div class="swatch" style="background:#2e7d32" data-color="#2e7d32"></div>
            <div class="swatch" style="background:#1565c0" data-color="#1565c0"></div>
            <div class="swatch" style="background:#c62828" data-color="#c62828"></div>
            <div class="swatch" style="background:#ef6c00" data-color="#ef6c00"></div>
            <div class="swatch" style="background:#455a64" data-color="#455a64"></div>
        </div>
        <button id="openInstanceBtn">Otworz folder instancji</button>
    </div>

    <div id="content">
        <div class="card">
            <h2>Instancja</h2>
            <label>Wersja Minecraft
                <select id="mcVersion">
                    <option value="">Ladowanie wersji...</option>
                </select>
            </label>
            <label>
                <input type="checkbox" id="showSnapshots" style="width:auto; vertical-align:middle; margin-right:6px;" />
                Pokaz snapshoty
            </label>
            <label>Loader
                <select id="loaderSelect">
                    <option value="vanilla">Vanilla</option>
                    <option value="fabric">Fabric</option>
                    <option value="forge">Forge</option>
                </select>
            </label>
            <button class="btn" id="installLoaderBtn">Zainstaluj loader</button>
            <button class="btn" id="installIrisBtn">Iris + Sodium</button>
            <br>
            <button class="btn btn-play" id="launchBtn">GRAJ</button>
        </div>

        <div class="card">
            <h2>Mody (Modrinth)</h2>
            <input id="modSearch" placeholder="Szukaj mod..." />
            <button class="btn" id="modSearchBtn">Szukaj</button>
            <button class="btn" id="modUpdateAllBtn">Aktualizuj wszystkie mody</button>
            <ul id="modResults"></ul>
        </div>

        <div class="card" id="logCard">
            <h2>Log</h2>
            <div id="logOutput"></div>
        </div>
    </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
